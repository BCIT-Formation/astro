version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: chore
    include: scope
  groups:
    next-ecosystem:
      patterns:
      - next
      - react
      - react-dom
      - '@types/react*'
    tailwind-ecosystem:
      patterns:
      - tailwindcss
      - '@tailwindcss/*'
    capacitor-ecosystem:
      patterns:
      - '@capacitor/*'
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Europe/Paris
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: ci
    include: scope
  groups:
    github-actions:
      patterns:
      - '*'
